<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Portfolio of Rahmat Ullah Zadran: software engineer, .NET developer and researcher." />
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<title>Rahmat Ullah Zadran | Software Engineer</title>
<script>
  /* Apply the saved theme before first paint so there is no colour flash. */
  try {
    var s = JSON.parse(localStorage.getItem('rz-portfolio-settings') || '{}');
    var d = s.mode === 'dark' || (s.mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    if (d) document.documentElement.classList.add('dark');
    if (/^#[0-9a-f]{6}$/i.test(s.accent || '')) {
      var n = parseInt(s.accent.slice(1), 16);
      document.documentElement.style.setProperty('--brand', ((n >> 16) & 255) + ' ' + ((n >> 8) & 255) + ' ' + (n & 255));
    }
  } catch (e) {}
</script>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
